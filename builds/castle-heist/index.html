<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Castle Heist</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body class="play-page">
  <a class="back" href="../../">All builds</a>
  <div class="stage" style="--play-ratio: calc(960 / 2700)">
    <iframe
      src="play/index.html"
      title="Castle Heist"
      allow="fullscreen; autoplay"
      scrolling="no"
    ></iframe>
  </div>
  <div class="rotate-gate" role="alertdialog" aria-label="Portrait orientation required">
    <div class="phone" aria-hidden="true"></div>
    <h1>Portrait only</h1>
    <p>This build plays upright. Turn the device to portrait.</p>
  </div>
  <script>
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("portrait").catch(function () {});
    }
  </script>
</body>
</html>
